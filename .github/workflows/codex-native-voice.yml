name: codex-native-voice

on:
  push:
    branches: [codex-native-voice]
  pull_request:
    paths:
      - "packages/core/**"
      - "packages/llm/**"
      - "packages/schema/**"
      - "packages/protocol/**"
      - "packages/server/**"
      - "packages/client/**"
      - "packages/opencode/test/server/httpapi-voice-lifecycle.test.ts"
      - ".github/workflows/codex-native-voice.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCODE_DISABLE_MODELS_FETCH: "true"
      GOMEMLIMIT: 2GiB
      GOGC: "25"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install native build helper and locked dependencies
        run: |
          npm install --global node-gyp@11.5.0
          bun install --frozen-lockfile
          git config --global user.email "test@example.invalid"
          git config --global user.name "OpenCode lifecycle tests"
      - name: Check types
        run: |
          for package in schema llm core protocol server client opencode; do
            (cd "packages/$package" && bun typecheck)
          done
      - name: Test schemas and generated clients
        run: |
          (cd packages/schema && bun test)
          (cd packages/client && bun test && bun run check:generated)
      - name: Test provider and Session behavior with recorded/local fixtures
        run: |
          (cd packages/llm && bun test)
          (cd packages/core && bun test)
      - name: Test localhost HTTP and replay integration
        working-directory: packages/opencode
        run: >-
          bun test --timeout 60000
          test/server/httpapi-voice-lifecycle.test.ts
          test/server/httpapi-session.test.ts
          test/server/httpapi-v2-location.test.ts
          test/server/httpapi-event.test.ts
          test/server/httpapi-public-openapi.test.ts
